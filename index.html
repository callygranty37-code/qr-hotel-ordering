
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Hotel Ordering</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f1f5f2;
      color: #222;
    }
    header {
      background: #176b45;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }
    main {
      max-width: 480px;
      margin: 20px auto;
      padding: 0 12px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
    }
    label, input, button {
      font-size: 16px;
    }
    input[type="number"], input[type="text"] {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0 16px;
      border: 1px solid #bbb;
      border-radius: 8px;
    }
    .food {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
    }
    .food input {
      width: 22px;
      height: 22px;
    }
    .price {
      margin-left: auto;
      font-weight: bold;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #176b45;
      color: white;
      font-weight: bold;
      padding: 14px;
      margin-top: 16px;
    }
    #message {
      white-space: pre-wrap;
      font-weight: bold;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍽️ QR Hotel Menu</h1>
    <p>Fresh food. Easy ordering.</p>
  </header>

  <main>
    <div class="card">
      <h2>Place Your Order</h2>

      <label for="table">Your table number</label>
      <input id="table" type="number" min="1"
        step="1" placeholder="e.g. 5">

      <h3>Choose your food</h3>

      <div class="food">
        <input type="checkbox" value="300"
          data-name="Chips" id="chips">
        <label for="chips">Chips</label>
        <span class="price">KSh 300</span>
      </div>

      <div class="food">
        <input type="checkbox" value="250"
          data-name="Tea and snacks" id="tea">
        <label for="tea">Tea and snacks</label>
        <span class="price">KSh 250</span>
      </div>

      <div class="food">
        <input type="checkbox" value="450"
          data-name="Chicken and rice" id="chicken">
        <label for="chicken">Chicken and rice</label>
        <span class="price">KSh 450</span>
      </div>

      <div class="food">
        <input type="checkbox" value="200"
          data-name="Sausages" id="sausages">
        <label for="sausages">Sausages</label>
        <span class="price">KSh 200</span>
      </div>

      <label for="notes">Special instructions (optional)</label>
      <input id="notes" type="text"
        placeholder="e.g. No onions">

      <h3 id="total">Total: KSh 0</h3>
      <button id="orderButton" type="button">Review Order</button>
      <p id="message" role="status"></p>
    </div>
  </main>

  <script>
    const items = [...document.querySelectorAll('.food input')];
    const total = document.getElementById('total');
    const message = document.getElementById('message');

    function updateTotal() {
      const sum = items
        .filter(item => item.checked)
        .reduce((amount, item) => amount + Number(item.value), 0);

      total.textContent = 'Total: KSh ' + sum;
    }

    items.forEach(item =>
      item.addEventListener('change', updateTotal)
    );

    document.getElementById('orderButton')
      .addEventListener('click', () => {
        const tableInput = document.getElementById('table');
        const table = Number(tableInput.value);
        const selected = items.filter(item => item.checked);

        if (!tableInput.value || !Number.isInteger(table) || table < 1) {
          message.textContent = 'Please enter a valid table number.';
          return;
        }

        if (selected.length === 0) {
          message.textContent = 'Please select at least one food item.';
          return;
        }

        const sum = selected.reduce(
          (amount, item) => amount + Number(item.value), 0
        );

        const names = selected.map(item =>
          item.dataset.name + ' (KSh ' + item.value + ')'
        );

        message.textContent =
          'ORDER REVIEW\n' +
          'Table: ' + table + '\n' +
          names.join('\n') + '\n' +
          'Total: KSh ' + sum + '\n' +
          'Instructions: ' +
          (document.getElementById('notes').value.trim() || 'None') +
          '\n\nPreview only — order not yet sent to the kitchen.';
      });
  </script>
</body>
</html>
