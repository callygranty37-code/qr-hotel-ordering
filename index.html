
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Hotel Ordering</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f7f4; color: #183126; }
    header { background: #176b45; color: white; text-align: center; padding: 24px 12px; }
    main { max-width: 650px; margin: auto; padding: 16px; }
    .card { background: white; padding: 16px; margin: 12px 0; border-radius: 12px; box-shadow: 0 2px 8px #0001; }
    label { display: block; margin: 12px 0 6px; font-weight: bold; }
    input, select, button { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; }
    input, select { border: 1px solid #bbb; }
    .food { display: flex; align-items: center; gap: 12px; }
    .food input { width: 22px; }
    .price { margin-left: auto; font-weight: bold; }
    button { border: 0; background: #176b45; color: white; font-weight: bold; margin-top: 16px; }
    #message { white-space: pre-wrap; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>🍽️ QR Hotel Menu</h1>
    <p>Fresh food. Easy ordering.</p>
  </header>

  <main>
    <div class="card">
      <h2>Place Your Order</h2>
      <label for="table">Your table number</label>
      <input id="table" type="number" min="1" placeholder="e.g. 5" required>

      <h3>Choose your food</h3>
      <div class="food">
        <input type="checkbox" value="300" data-name="Chips" id="chips">
        <label for="chips">Chips</label>
        <span class="price">KSh 300</span>
      </div>
      <div class="food">
        <input type="checkbox" value="250" data-name="Tea and snacks" id="tea">
        <label for="tea">Tea and snacks</label>
        <span class="price">KSh 250</span>
      </div>
      <div class="food">
        <input type="checkbox" value="450" data-name="Chicken and rice" id="chicken">
        <label for="chicken">Chicken and rice</label>
        <span class="price">KSh 450</span>
      </div>
      <div class="food">
        <input type="checkbox" value="200" data-name="Sausages" id="sausages">
        <label for="sausages">Sausages</label>
        <span class="price">KSh 200</span>
      </div>

      <label for="notes">Special instructions (optional)</label>
      <input id="notes" type="text" placeholder="e.g. No onions">

      <h3 id="total">Total: KSh 0</h3>
      <button id="orderButton" type="button">Review Order</button>
      <p id="message" role="status"></p>
    </div>
  </main>

  <script>
    const items = [...document.querySelectorAll('.food input')];
    const total = document.getElementById('total');
    const message = document.getElementById('message');

    function updateTotal() {
      const sum = items.filter(item => item.checked)
        .reduce((amount, item) => amount + Number(item.value), 0);
      total.textContent = 'Total: KSh ' + sum;
    }

    items.forEach(item => item.addEventListener('change', updateTotal));

    document.getElementById('orderButton').addEventListener('click', () => {
      const table = document.getElementById('table').value;
      const selected = items.filter(item => item.checked);

      if (!table || Number(table) < 1) {
        message.textContent = 'Please enter a valid table number.';
        return;
      }
      if (selected.length === 0) {
        message.textContent = 'Please select at least one food item.';
        return;
      }

      const names = selected.map(item =>
        item.dataset.name + ' (KSh ' + item.value + ')'
      );
      const sum = selected.reduce((amount, item) =>
        amount + Number(item.value), 0
      );

      message.textContent =
        'ORDER REVIEW\nTable: ' + table +
        '\n' + names.join('\n') +
        '\nTotal: KSh ' + sum +
        '\nInstructions: ' +
        (document.getElementById('notes').value || 'None') +
        '\n\nThis is a preview only. Your order has NOT been sent to the kitchen yet.';
    });
  </script>
</body>
</html>
