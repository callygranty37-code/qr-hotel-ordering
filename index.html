
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Hotel Ordering System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f2f5f2;
color:#222;
}
header{
background:#14532d;
color:white;
padding:24px 12px;
text-align:center;
}
header h1{margin:0}
main{
max-width:650px;
margin:auto;
padding:15px;
}
.card{
background:white;
padding:16px;
margin:14px 0;
border-radius:12px;
box-shadow:0 2px 6px #ddd;
}
h2{color:#166534}
.item{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
border-bottom:1px solid #ddd;
padding:13px 0;
}
button{
background:#15803d;
color:white;
border:0;
padding:11px 15px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
}
button:disabled{opacity:.5}
.minus{background:#555}
.qty{
display:flex;
align-items:center;
gap:9px;
}
input,textarea{
width:100%;
padding:12px;
margin:8px 0 14px;
border:1px solid #ccc;
border-radius:7px;
font-size:16px;
}
.total{
font-size:23px;
font-weight:bold;
color:#166534;
}
.send{
width:100%;
margin-top:12px;
font-size:17px;
}
footer{
text-align:center;
padding:20px;
color:#666;
}
</style>
</head>

<body>

<header>
<h1>QR HOTEL ORDERING</h1>
<p>Welcome! Order your favourite food and drinks.</p>
</header>

<main>

<div class="card">
<h2>🍽️ Food Menu</h2>
<div id="food"></div>
</div>

<div class="card">
<h2>🥤 Drinks Menu</h2>
<div id="drinks"></div>
</div>

<div class="card">
<h2>🛒 Your Order</h2>

<div id="cart">No items added yet.</div>

<p class="total">
Total: KSh <span id="total">0</span>
</p>

<label>Table Number</label>
<input id="table" type="number" min="1"
placeholder="Enter your table number">

<label>Special Instructions</label>
<textarea id="notes"
placeholder="Any special requests?"></textarea>

<button class="send" id="send" onclick="sendOrder()">
Send Order
</button>
</div>

</main>

<footer>
QR Hotel Ordering System
</footer>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL =
"https://atagmpwyrhjobqujocfz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_YkgXx03LGRK9cXWXSY3LGQ_pt9pimjo";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

// HOTEL MENU

const products = [
{name:"Chips",price:150,category:"food"},
{name:"Chicken",price:350,category:"food"},
{name:"Beef",price:300,category:"food"},
{name:"Rice",price:150,category:"food"},
{name:"Ugali",price:50,category:"food"},
{name:"Fish",price:400,category:"food"},
{name:"Soda",price:80,category:"drinks"},
{name:"Water",price:50,category:"drinks"},
{name:"Juice",price:120,category:"drinks"},
{name:"Tea",price:50,category:"drinks"}
];

let cart = {};

// DISPLAY MENU

function showMenu(category,id){

const menu = products.filter(
p => p.category === category
);

document.getElementById(id).innerHTML =
menu.map(p => `
<div class="item">
<div>
<strong>${p.name}</strong><br>
KSh ${p.price}
</div>

<button onclick="addItem('${p.name}')">
Add +
</button>
</div>
`).join("");

}

// ADD ITEMS

function addItem(name){

cart[name] = (cart[name] || 0) + 1;

updateCart();

}

// CHANGE QUANTITY

function changeQty(name,amount){

cart[name] += amount;

if(cart[name] <= 0){
delete cart[name];
}

updateCart();

}

// UPDATE CUSTOMER ORDER

function updateCart(){

const names = Object.keys(cart);

let total = 0;

if(names.length === 0){

document.getElementById("cart").innerHTML =
"No items added yet.";

}else{

document.getElementById("cart").innerHTML =
names.map(name => {

const product = products.find(
p => p.name === name
);

const subtotal = product.price * cart[name];

total += subtotal;

return `
<div class="item">

<div>
<strong>${name}</strong><br>
KSh ${subtotal}
</div>

<div class="qty">

<button class="minus"
onclick="changeQty('${name}',-1)">
−
</button>

<strong>${cart[name]}</strong>

<button onclick="changeQty('${name}',1)">
+
</button>

</div>
</div>
`;

}).join("");

}

document.getElementById("total").textContent = total;

}

// SEND ORDER TO SUPABASE

async function sendOrder(){

const table =
document.getElementById("table").value;

const notes =
document.getElementById("notes").value;

const button =
document.getElementById("send");

if(!table || Number(table) < 1){

alert("Please enter your table number.");

return;

}

if(Object.keys(cart).length === 0){

alert("Please add food or drinks first.");

return;

}

const items = Object.keys(cart).map(name => {

const product = products.find(
p => p.name === name
);

return {
name:name,
quantity:cart[name],
price:product.price,
subtotal:product.price * cart[name]
};

});

const total = items.reduce(
(sum,item) => sum + item.subtotal,0
);

button.disabled = true;
button.textContent = "Sending order...";

try{

const {error} = await db
.from("orders")
.insert([{

table_number:Number(table),
status:"pending",
items:items,
total_amount:total,
notes:notes

}]);

if(error){
throw error;
}

alert(
"Order sent successfully!\n" +
"Table: " + table +
"\nTotal: KSh " + total
);

cart = {};

document.getElementById("table").value = "";
document.getElementById("notes").value = "";

updateCart();

}catch(error){

alert("Order failed: " + error.message);

}finally{

button.disabled = false;
button.textContent = "Send Order";

}

}

// START SYSTEM

showMenu("food","food");
showMenu("drinks","drinks");
updateCart();

</script>

</body>
</html>
