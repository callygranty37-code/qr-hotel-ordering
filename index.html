
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Hotel Ordering System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f2f5f2;color:#222}
header{background:#14532d;color:white;text-align:center;padding:22px 12px}
main{max-width:750px;margin:auto;padding:14px}
.card{background:white;padding:16px;margin:14px 0;border-radius:12px;box-shadow:0 2px 6px #ddd}
h2{color:#166534}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ddd;padding:12px 0}
button{background:#15803d;color:white;border:0;padding:11px 14px;border-radius:7px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.minus{background:#555}
.qty{display:flex;align-items:center;gap:9px}
input,textarea,select{width:100%;padding:12px;margin:8px 0 14px;border:1px solid #ccc;border-radius:7px;font-size:16px}
.total{font-size:23px;font-weight:bold;color:#166534}
.send{width:100%;margin-top:12px;font-size:17px}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.nav button{background:#fff;color:#14532d}
.nav button.active{background:#a7f3d0}
.hidden{display:none}
.order{border:1px solid #ddd;padding:13px;margin:12px 0;border-radius:9px}
.status{font-weight:bold;color:#166534}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>QR HOTEL ORDERING</h1>
<p>Welcome! Order your favourite food and drinks.</p>
<div class="nav">
<button id="customerTab" class="active" onclick="showPage('customer')">Customer Menu</button>
<button id="kitchenTab" onclick="showPage('kitchen')">Kitchen Dashboard</button>
</div>
</header>

<main>
<section id="customer">
<div class="card">
<h2>🍽️ Food Menu</h2>
<div id="food"></div>
</div>
<div class="card">
<h2>🥤 Drinks Menu</h2>
<div id="drinks"></div>
</div>
<div class="card">
<h2>🛒 Your Order</h2>
<div id="cart">No items added yet.</div>
<p class="total">Total: KSh <span id="total">0</span></p>
<label>Table Number</label>
<input id="table" type="number" min="1" placeholder="Enter table number">
<label>Special Instructions</label>
<textarea id="notes" placeholder="Any special requests?"></textarea>
<button class="send" id="send" onclick="sendOrder()">Send Order</button>
</div>
</section>

<section id="kitchen" class="hidden">
<div class="card">
<h2>👨‍🍳 Kitchen Dashboard</h2>
<p>Customer orders will appear here.</p>
<button onclick="loadOrders()">Refresh Orders</button>
<div id="orders">Loading orders...</div>
</div>
</section>
</main>

<footer>QR Hotel Ordering System</footer>

<script>
const SUPABASE_URL="https://atagmpwyrhjobqujocfz.supabase.co";
const SUPABASE_KEY="sb_publishable_YkgXx03LGRK9cXWXSY3LGQ_pt9pimjo";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const products=[
{name:"Chips",price:150,category:"food"},
{name:"Chicken",price:350,category:"food"},
{name:"Beef",price:300,category:"food"},
{name:"Rice",price:150,category:"food"},
{name:"Ugali",price:50,category:"food"},
{name:"Fish",price:400,category:"food"},
{name:"Soda",price:80,category:"drinks"},
{name:"Water",price:50,category:"drinks"},
{name:"Juice",price:120,category:"drinks"},
{name:"Tea",price:50,category:"drinks"}
];

let cart={};

function showPage(page){
document.getElementById("customer").classList.toggle("hidden",page!=="customer");
document.getElementById("kitchen").classList.toggle("hidden",page!=="kitchen");
document.getElementById("customerTab").classList.toggle("active",page==="customer");
document.getElementById("kitchenTab").classList.toggle("active",page==="kitchen");
if(page==="kitchen")loadOrders();
}

function showMenu(category,id){
const menu=products.filter(p=>p.category===category);
document.getElementById(id).innerHTML=menu.map(p=>`
<div class="item">
<div><strong>${p.name}</strong><br>KSh ${p.price}</div>
<button onclick="addItem('${p.name}')">Add +</button>
</div>`).join("");
}

function addItem(name){
cart[name]=(cart[name]||0)+1;
updateCart();
}

function changeQty(name,amount){
cart[name]=(cart[name]||0)+amount;
if(cart[name]<=0)delete cart[name];
updateCart();
}

function updateCart(){
const names=Object.keys(cart);
let total=0;
if(names.length===0){
document.getElementById("cart").innerHTML="No items added yet.";
}else{
document.getElementById("cart").innerHTML=names.map(name=>{
const p=products.find(x=>x.name===name);
const subtotal=p.price*cart[name];
total+=subtotal;
return `<div class="item">
<div><strong>${name}</strong><br>KSh ${subtotal}</div>
<div class="qty">
<button class="minus" onclick="changeQty('${name}',-1)">−</button>
<strong>${cart[name]}</strong>
<button onclick="changeQty('${name}',1)">+</button>
</div></div>`;
}).join("");
}
document.getElementById("total").textContent=total;
}

async function sendOrder(){
const table=document.getElementById("table").value.trim();
const notes=document.getElementById("notes").value.trim();
const button=document.getElementById("send");

if(!table||Number(table)<1){
alert("Please enter your table number.");
return;
}
if(!Object.keys(cart).length){
alert("Please add food or drinks first.");
return;
}

const items=Object.keys(cart).map(name=>{
const p=products.find(x=>x.name===name);
return {
name:name,
quantity:cart[name],
price:p.price,
subtotal:p.price*cart[name]
};
});
const total=items.reduce((sum,item)=>sum+item.subtotal,0);

button.disabled=true;
button.textContent="Sending order...";

try{
const {data:order,error}=await db.from("orders").insert([{
table_number:String(table),
status:"pending",
items:{lines:items,notes:notes},
total:total,
total_amount:total
}]).select("id").single();

if(error)throw error;

const orderItems=items.map(item=>({
order_id:order.id,
item_name:item.name,
quantity:item.quantity,
unit_price:item.price,
subtotal:item.subtotal
}));

const result=await db.from("order_items").insert(orderItems);
if(result.error)throw result.error;

alert("Order sent successfully!\nTable: "+table+"\nTotal: KSh "+total);
cart={};
document.getElementById("table").value="";
document.getElementById("notes").value="";
updateCart();

}catch(error){
alert("Order error: "+error.message+"\nPlease check Supabase permissions and table columns.");
}finally{
button.disabled=false;
button.textContent="Send Order";
}
}

async function loadOrders(){
const area=document.getElementById("orders");
area.textContent="Loading orders...";
const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
if(error){
area.textContent="Could not load orders: "+error.message;
return;
}
if(!data||data.length===0){
area.textContent="No orders received yet.";
return;
}
area.innerHTML=data.map(order=>{
let lines=[];
let notes="";
if(Array.isArray(order.items)){
lines=order.items;
}else if(order.items){
lines=order.items.lines||[];
notes=order.items.notes||"";
}
const total=order.total??order.total_amount??0;
return `<div class="order">
<h3>Order #${order.id}</h3>
<p><strong>Table:</strong> ${order.table_number}</p>
<p class="status">Status: ${order.status}</p>
<p><strong>Items:</strong></p>
${lines.map(item=>`<p>${item.name||item.item_name} × ${item.quantity} — KSh ${item.subtotal}</p>`).join("")}
${notes?`<p><strong>Instructions:</strong> ${notes}</p>`:""}
<p><strong>Total: KSh ${total}</strong></p>
<label>Update order status</label>
<select id="status-${order.id}">
<option value="pending" ${order.status==="pending"?"selected":""}>Pending</option>
<option value="preparing" ${order.status==="preparing"?"selected":""}>Preparing</option>
<option value="ready" ${order.status==="ready"?"selected":""}>Ready</option>
<option value="served" ${order.status==="served"?"selected":""}>Served</option>
<option value="cancelled" ${order.status==="cancelled"?"selected":""}>Cancelled</option>
</select>
<button onclick="updateStatus(${order.id})">Save Status</button>
</div>`;
}).join("");
}

async function updateStatus(id){
const status=document.getElementById("status-"+id).value;
const {error}=await db.from("orders").update({status:status}).eq("id",id);
if(error){
alert("Status update failed: "+error.message);
return;
}
alert("Order status updated.");
loadOrders();
}

showMenu("food","food");
showMenu("drinks","drinks");
updateCart();
</script>
</body>
</html>
